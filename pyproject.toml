[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cpfhub"]

[project]
name = "cpfhub"
version = "1.0.0"
description = "Official Python SDK for CPFHub.io — Brazilian CPF lookup API. Get name, gender and date of birth from any CPF in ~300ms."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "CPFHub.io", email = "contato@cpfhub.io" }
]
keywords = [
    "cpf",
    "cpf-api",
    "cpf-lookup",
    "cpf-validation",
    "cpf-consulta",
    "cpfhub",
    "brasil",
    "brazil",
    "receita-federal",
    "sdk",
    "api-client",
    "fintech",
    "kyc",
    "identity-verification",
    "onboarding",
    "lgpd",
    "validacao-cpf"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.28.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://cpfhub.io"
Documentation = "https://cpfhub.io/documentacao"
Repository = "https://github.com/cpfhub/cpfhub-python"
"Bug Tracker" = "https://github.com/cpfhub/cpfhub-python/issues"
Changelog = "https://github.com/cpfhub/cpfhub-python/blob/main/CHANGELOG.md"
